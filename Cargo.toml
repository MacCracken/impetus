[package]
name = "impetus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0"
description = "Physics engine — 2D/3D rigid body simulation, collision detection, constraints, and spatial queries for AGNOS"
homepage = "https://github.com/MacCracken/impetus"
repository = "https://github.com/MacCracken/impetus"
readme = "README.md"
keywords = ["physics", "simulation", "collision", "rigid-body", "game"]
categories = ["simulation", "game-engines"]

[features]
default = ["2d"]
2d = ["dep:rapier2d"]
3d = ["dep:rapier3d"]
serialize = ["dep:bincode"]
full = ["2d", "3d", "serialize"]

[dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Math
glam = { version = "0.29", features = ["serde"] }

# Physics backends
rapier2d = { version = "0.22", optional = true }
rapier3d = { version = "0.22", optional = true }

# Serialization
bincode = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simulation"
harness = false
