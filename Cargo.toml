[package]
name = "impetus"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Physics engine — 2D/3D rigid body simulation, collision detection, constraints, and spatial queries for AGNOS"
homepage = "https://github.com/MacCracken/impetus"
repository = "https://github.com/MacCracken/impetus"
readme = "README.md"
keywords = ["physics", "simulation", "collision", "rigid-body", "game"]
categories = ["simulation", "game-engines"]

[features]
default = ["2d"]
2d = ["dep:hisab"]
3d = ["dep:hisab"]
serialize = ["dep:bitcode"]
full = ["2d", "3d", "serialize"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Physics backend — native, built on hisab math
hisab = { version = "1.1", optional = true }

# Serialization (optional)
bitcode = { version = "0.6", features = ["serde"], optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "simulation"
harness = false

[[example]]
name = "basic_physics"

[[example]]
name = "platformer"

[[test]]
name = "integration"
