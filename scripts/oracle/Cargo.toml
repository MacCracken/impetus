[package]
name = "impetus-oracle"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false
description = "Drives the frozen Rust impetus 1.4.0 in rust-old/ to write the Cyrius port's golden corpus"

# The oracle is used by path and never built or edited in place (CLAUDE.md: do not modify
# rust-old/). Cargo.lock was seeded from rust-old/Cargo.lock, so every shared dependency (glam
# above all, through hisab 1.4.0) resolves to the version the oracle was tested with.
# `oracle` is the hidden state-dump feature (port plan §4 step 0); `serialize` exposes
# `PhysicsWorld::MAX_SNAPSHOT_INDEX` and the bitcode snapshot (M6 reference).
[dependencies]
impetus = { path = "../../rust-old", default-features = false, features = ["oracle", "serialize"] }
# The oracle's own JSON: the version rust-old's tests use (its Cargo.lock), for the serde rows
# (ADR 0010). `float_roundtrip` makes its float parsing correctly rounded: the default fast path is
# off by 1 ulp on some long decimals (it can't read back what it wrote), and the port's parse is
# correctly rounded. Writing is the same in both modes.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde = "1"
# glam's D-types as the oracle links them, re-exported by hisab 1.4.0 (`b3_math.tsv`, ADR 0012): the version
# rust-old's 3D backend resolves (its Cargo.lock), already in this lock, so nothing new is fetched.
hisab = { version = "=1.4.0", optional = true }

# The oracle's backends are exclusive, so the generator is one crate run twice
# (port plan §4 step 5):
#   cargo run --release --locked --manifest-path scripts/oracle/Cargo.toml                       # 2D + shared
#   cargo run --release --locked --manifest-path scripts/oracle/Cargo.toml \
#       --no-default-features --features b3                                                     # 3D
[features]
default = ["b2"]
b2 = ["impetus/2d"]
b3 = ["impetus/3d", "dep:hisab"]

[[bin]]
name = "oracle"
path = "src/main.rs"

[profile.release]
# Correctness, not speed: keep overflow checks so a bad grid index fails loudly.
overflow-checks = true
